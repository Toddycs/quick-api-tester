<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>API Tester</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="dark">
  <header>
    <h1>API Tester</h1>
    <!-- <label class="theme-toggle">
      <input type="checkbox" id="themeSwitcher" />
      <span>🌙 / ☀️</span>
    </label> -->
  </header>

  <main>
    <section class="request-form">
      <div class="form-row">
        <select id="method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
        </select>
        <input type="text" id="url" placeholder="https://api.exemplo.com/dado" />
        <button id="send">Enviar</button>
      </div>

      <div class="form-row headers-wrapper" id="headers">
        <!-- Headers serão adicionados aqui -->
      </div>
      <button id="addHeader" class="add-header-btn">+ Adicionar Header</button>

      <textarea id="body" placeholder='{"exemplo": "valor"}'></textarea>
    </section>

    <section class="response-box">
      <div id="status"></div>
      <pre id="response"></pre>
      <button id="copyResponse">Copiar Resposta</button>
    </section>

    <section class="history-box">
      <h2>Histórico de Requisições</h2>
      <ul id="history"></ul>
    </section>
  </main>

  <script src="script.js"></script>

  <footer class="footer">
    <div class="container">
      <p class="m-0">Feito com 💜 por Nicolas Kevin</p>
      <div class="social-icons">
        <a href="https://www.linkedin.com/in/nicolas-kevin/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="fab fa-linkedin fa-lg"></i>
        </a>
        <a href="https://www.instagram.com/nicolas.toddy" target="_blank" rel="noopener" aria-label="Instagram">
          <i class="fab fa-instagram fa-lg"></i>
        </a>
      </div>
    </div>
  </footer>
  
</body>
</html>
